# Terms of use for every third-party source this project uses.
#
# Why: the HAIC brief (Special Requirements) says to "confirm terms of use for third-party data
# before use".
#
# RULES (same as programs.yaml and boundaries.yaml)
#   - Every quote was read from the page listed in `terms_url` on `checked_on`. Quotes are
#     verbatim and short; they are not legal advice and not the full terms.
#   - A field the page did not state is null (or "not stated"). Nothing is filled in from memory.
#   - `open_questions` are things we could NOT settle from the pages. Ask the challenge team
#     (Slack #c_dbedt_agent) or the publisher, then record the answer here.

sources:
  - id: census_data_api
    publisher: U.S. Census Bureau
    used_for: "ACS 5-year estimates for legislative districts, counties and the state (downloaded once by pipeline/fetch_acs.py, saved in pipeline/raw/acs/, read by pipeline/build.py); live cross-check against ACS subject tables (validation/validate.py)"
    terms_url: https://www.census.gov/data/developers/about/terms-of-service.html
    page_last_revised: "2026-04-14"
    checked_on: 2026-11-13
    attribution_required: true
    required_notice: "This product uses the Census Bureau Data API but is not endorsed or certified by the Census Bureau."
    quotes:
      who_may_use: "You may use the Census Bureau API to develop a service"
      notice: "All services, which utilize or access the API, should display the following notice prominently within the application:"
      endorsement: "You may not use the Census Bureau name, or the like to imply endorsement"
      modification: "You may not modify or falsely represent content accessed through the API and still claim the source is the Census Bureau."
      disclaimer: "The API is provided \"as is\" and on an \"as-available\" basis."
      re_identification: "users will not use these data, alone or in combination with any other Census or non-Census data, to identify any individual person."
    not_stated: [free_of_charge, commercial_use_restriction, redistribution_or_caching, api_key_requirement_on_this_page]
    related:
      - url: https://www.census.gov/about/policies/citation.html
        note: "Citing our Data. Its Public-Use Statement says users \"should cite the Census Bureau as the source of the original data only.\" (a citation instruction, not a licence)"
    how_we_comply:
      - "The notice is shown in the page footer (web/index.html)."
      - "Percentages and margins of error we calculate are labeled as calculated (\"Percentages are calculated from published counts\", \"about plus or minus\"), so we do not present derived figures as Census-published."
      - "Every figure cites the Census Bureau, the ACS table and the year."
      - "The app only shows aggregated district figures and does not try to identify any individual."
    open_questions: []

