programs:
  - id: snap
    name: Supplemental Nutrition Assistance Program (SNAP)
    agency: Hawaiʻi Department of Human Services (DHS), Benefit, Employment & Support Services Division (BESSD)
    url: https://humanservices.hawaii.gov/bessd/snap/
    file: programs/snap_dhs_page.pdf
    serves: Low-income households, for food.
    related_measures: [snap_share, poor_households_without_snap_share, under_125pct_poverty_share, under_200pct_poverty_share, poverty_rate]
    uptake: [snap_cases_monthly, snap_people_monthly]
    facts:
      - topic: eligibility
        text: U.S. citizens and some lawful permanent residents may qualify; households must prove their circumstances.
        quote: "U.S. citizens and some aliens who are admitted for permanent residency may qualify."
      - topic: eligibility
        text: Under broad-based categorical eligibility (which most households receive), the gross income limit is 200% of the federal poverty level and there is no asset limit.
        quote: "Under BBCE, the gross income limit is 200% FPL and there is an unlimited asset standard."
      - topic: eligibility
        text: Households where everyone receives TANF or SSI cash assistance qualify with no income or asset limit.
        quote: "There is no gross income limit, no net income limit and no asset limit."
      - topic: eligibility
        text: Households with an elderly or disabled member face only the net income test.
        quote: "Households with an elderly or disabled member are subject only to the net income test."
      - topic: eligibility
        text: Most able-bodied adults must meet work requirements, and every household member needs a Social Security number (or must apply for one).
        quote: "Most able-bodied adult applicants must meet certain work requirements."
      - topic: apply
        text: Apply online, or mail or drop off a paper application at a processing center. DHS then contacts the applicant for an interview.
        quote: "There are 3 ways to submit your application:"
      - topic: contact
        text: "Public Assistance Information Line (toll free): 1-855-643-1643"
        quote: "Public Assistance Toll Free Information Line at 1-855-643-1643."
      - topic: note
        text: An intake worker makes the final determination of eligibility.
        quote: "An intake worker will make the final determination of"
    income_limits:
      valid_for: "Effective 10/1/2026"
      description: Gross monthly income, by household size. Standard limit 130% of the federal poverty level; 200% under broad-based categorical eligibility (BBCE).
      unit: dollars per month
      columns: ["130% FPL", "200% FPL (BBCE)"]
      by_household_size:
        1: [1989, 3060]
        2: [2697, 4150]
        3: [3404, 5238]
        4: [4112, 6326]
        5: [4819, 7414]
        6: [5527, 8502]
        7: [6234, 9590]
        8: [6941, 10680]
    likely_eligible:
      estimated: true
      indicator: snap_likely_eligible
      cut_percent: 200
      limit_column: 1   # income_limits column the cut must match: "200% FPL (BBCE)"
      acs_cut: "Income under 200% of the poverty level (ACS table C17002: ratio of income to poverty under 2.00)"
      rule: "Gross income under 200% of the federal poverty level, under broad-based categorical eligibility (BBCE), which most households receive. BBCE has no asset limit and, since February 2025, no net income test."
      rule_quotes:
        - "Under BBCE, the gross income limit is 200% FPL and there is an unlimited asset standard."
        - "As of February 1, 2025, under BBCE households are also not subject to the net income test."
        - "Most households qualify for BBCE"
      universe: pop_ratio_universe
      universe_label: "Residents for whom the Census Bureau determines poverty status (ACS table C17002). It leaves out people living in institutions, military barracks and college dorms, and unrelated children under 15."
      contained_in: [pop_ratio_universe, pop_total]
      unit_note: "Counts people, not households. SNAP counts households (people who buy and prepare food together); the ACS compares each family's income with the poverty line for a family of its size."
      direction: uncertain
      direction_text: "Could run high or low. The income test is applied on a national scale that leaves out some Hawaiʻi residents under the limit (low), while rules other than income, which the survey cannot apply, would remove some people counted here (high)."
      runs_low:
        - "The ACS compares income with the Census Bureau's national poverty thresholds, which are the same in every state. HHS sets Hawaiʻi's guidelines about 15% higher (2026: $18,360 for one person, against $15,960 in the 48 contiguous states), so 200% of the Hawaiʻi guideline is roughly 230% on the national scale. The ACS table used (C17002) has no cut above 200%, so people between the two are not counted."
        - "Households with an elderly or disabled member face only the net income test, and households where everyone receives TANF or SSI cash assistance have no income limit, so some people above 200% qualify."
      runs_high:
        - "Only U.S. citizens and some lawful permanent residents may qualify; the survey cannot apply immigration rules."
        - "Most able-bodied adults must meet work requirements, and every household member needs a Social Security number."
        - "A household member disqualified under SNAP may keep the household out of BBCE."
      either_way:
        - "The ACS measures income over the past 12 months; SNAP looks at current monthly income."
        - "SNAP households and Census families are different units: people who share a home but buy food separately can be separate SNAP households."
      caveat: "Estimate. Applies only SNAP's gross income limit (200% of poverty, BBCE), not its other rules, and counts people rather than households."

  - id: med_quest
    name: Med-QUEST (Hawaiʻi Medicaid)
    agency: Hawaiʻi Department of Human Services, Med-QUEST Division
    url: https://medquest.hawaii.gov/en/members-applicants/get-started/how-to-apply
    file: programs/medquest_how_to_apply.pdf
    serves: Free or low-cost health coverage for people with low income, including children, pregnant women, parents and adults.
    related_measures: [low_income_uninsured_rate, no_insurance_rate, medicaid_share, under_200pct_poverty_share]
    uptake: [medquest_managed_care]
    facts:
      - topic: eligibility
        file: programs/medquest_2026_income_standards.pdf
        text: For income-based (MAGI) coverage, assets do not count.
        quote: "ASSETS ARE EXEMPT FOR INDIVIDUALS SUBJECT TO MAGI METHODOLOGY"
      - topic: eligibility
        file: programs/medquest_2026_income_standards.pdf
        text: A 5% income disregard can be added to the highest income standard a person qualifies for, so the effective limits are 5 points higher than the base standard (e.g. adults 138% instead of 133%).
        quote: "The 5% income disregard is ONLY added to the highest income standard the individual qualifies for and ONLY if it will make them eligible."
      - topic: apply
        text: "Apply online at https://medical.mybenefits.hawaii.gov, by phone, or by mail or fax using form DHS 1100."
        quote: "Apply Faster Online at https://medical.mybenefits.hawaii.gov"
      - topic: contact
        text: "Med-QUEST Customer Service: 1-800-316-8005 (toll free); TTY 1-855-889-4325 or 711."
        quote: "1-800-316-8005 toll-free TTY users, call 1-855-889-4325 toll-free or"
      - topic: documents
        text: "Application form: DHS 1100 \"Application for Health Coverage and Help Paying Costs\". People needing long-term care or with a disability need additional forms (DHS 1100B and others)."
        quote: "DHS 1100 \"Application for Health Coverage and Help Paying Costs\""
      - topic: change
        file: programs/medquest_2027_adult_changes.pdf
        text: "Starting January 1, 2027, adults 19-64 who are not blind, disabled or pregnant must renew every six months and show they work or volunteer at least 80 hours a month, earn at least $580 a month, or are enrolled at least half time in school."
        quote: "These changes only impact adults between 19-64 who are not Blind,"
    income_limits:
      file: programs/medquest_2026_income_standards.pdf
      valid_for: "2026 MAGI income standards, effective 01/13/2026"
      description: Monthly income, by household size, including the 5% disregard (the chart's maximum MAGI standard).
      unit: dollars per month
      columns: ["Adults 19-64 (138% FPL)", "Parents/caretakers (105% FPL)", "Pregnant women and infants under 1 (196% FPL)", "Children under 19, CHIP (313% FPL)"]
      by_household_size:
        1: [2112, 1607, 2999, 4789]
        2: [2863, 2178, 4066, 6493]
        3: [3614, 2750, 5132, 8196]
        4: [4365, 3321, 6199, 9899]
        5: [5116, 3892, 7266, 11602]
        6: [5867, 4464, 8332, 13306]
        7: [6618, 5035, 9399, 15009]
        8: [7369, 5607, 10465, 16712]
    likely_eligible:
      estimated: true
      indicator: medquest_likely_eligible
      cut_percent: 138
      limit_column: 0   # income_limits column the cut must match: "Adults 19-64 (138% FPL)"
      file: programs/medquest_2026_income_standards.pdf
      acs_cut: "Income under 138% of the poverty level (ACS table C27016: under 1.00 plus 1.00 to 1.37)"
      rule: "Income-based (MAGI) coverage for adults 19-64: income up to 138% of the federal poverty level (133% plus the 5% disregard), with no asset test. Children under 19 qualify up to 313%, so every child counted here is under the children's limit."
      rule_quotes:
        - "MAX MAGI STANDARD: This is the minimum MAGI income standard plus the 5% disregard"
        - "ASSETS ARE EXEMPT FOR INDIVIDUALS SUBJECT TO MAGI METHODOLOGY"
        - "2026 MAGI-EXCEPTED ASSET LIMITS"
      universe_label: "Civilian residents not living in institutions, for whom the Census Bureau determines poverty status (ACS table C27016). Active-duty military are not counted."
      contained_in: [pop_insurance_universe, pop_ratio_universe, pop_total]
      unit_note: "Counts people of all ages. Med-QUEST counts income for a tax household under MAGI rules; the ACS compares each family's income with the poverty line for a family of its size."
      direction: low
      direction_text: "Likely runs low. It leaves out children and pregnant women who qualify above 138%, and the national income scale leaves out some Hawaiʻi residents under the limit. Statewide, Med-QUEST has about twice as many members as this estimate."
      runs_low:
        - "Children under 19 qualify up to 313% and pregnant women up to 196%; the ACS tables used here do not split those groups at those limits, so people between 138% and those limits are not counted."
        - "The ACS compares income with the Census Bureau's national poverty thresholds, the same in every state. HHS sets Hawaiʻi's guidelines about 15% higher (2026: $18,360 for one person, against $15,960 in the 48 contiguous states), so 138% of the Hawaiʻi guideline is roughly 159% on the national scale."
        - "Other routes to coverage (for example medically needy spend-down, and aged, blind or disabled coverage) are not counted above 138%."
      runs_high:
        - "Residents 65 and older are counted, but they are covered under other (MAGI-excepted) rules with asset limits ($2,000 for one person in 2026)."
        - "Immigration-status rules apply; the survey cannot apply them and the saved documents do not detail them."
        - "From January 1, 2027, adults 19-64 who are not blind, disabled or pregnant must show work, school or volunteering, which may reduce the number who qualify."
      either_way:
        - "The ACS measures income over the past 12 months; Med-QUEST looks at current monthly income, and each program decides what income counts and who is in the household (HHS)."
      caveat: "Estimate. Applies only the adult income limit (138% of poverty) to residents of every age; leaves out children and pregnant women who qualify above it."

  - id: hawaii_eitc
    name: Hawaiʻi Earned Income Tax Credit (EITC)
    agency: Hawaiʻi Department of Taxation (DOTAX)
    url: https://tax.hawaii.gov/geninfo/
    file: programs/dotax_eitc.pdf
    serves: Working people with low to moderate income. Refundable, so it is paid even when no tax is owed, but only if it is claimed on a tax return.
    related_measures: [income_under_50k_share, poverty_rate]
    uptake: [dotax_eitc_claims]
    tax_area_uptake: eitc
    facts:
      - topic: eligibility
        text: The Hawaiʻi EITC is 40% of the person's federal EITC, so a federal return must be filed first.
        quote: "A federal return must"
      - topic: eligibility
        text: Earned income under the federal AGI limits, and investment income below $11,950 (tax year 2025).
        quote: "Earned Income under Federal AGI limits. Investment Income below $11,950."
      - topic: apply
        text: "Claim it by filing a federal income tax return and a Hawaiʻi income tax return (N-11 or N-15)."
        quote: "Hawai'i income tax return (N-11/N-15)"
      - topic: note
        text: Limits change every year; check the IRS rules before filing.
        quote: "Limits and rules change annually, visit IRS website to confirm"
    income_limits:
      valid_for: "2025 tax year"
      description: Maximum credit and maximum federal adjusted gross income, by number of children or relatives claimed.
      unit: dollars per year
      columns: ["Max Hawaiʻi EITC", "Max federal AGI, single", "Max federal AGI, married filing jointly"]
      by_children:
        "0": [260, 19104, 26214]
        "1": [1731, 50434, 57554]
        "2": [2861, 57310, 64430]
        "3 or more": [3218, 61555, 68675]
    likely_eligible:
      estimated: false
      reason: "No district estimate. The limits are federal AGI in dollars by number of children and filing status (about 104% to 203% of the Hawaiʻi guideline for the matching household size), the credit needs earned income, and it is paid only on a filed tax return. The ACS district tables in this tool do not cross income-to-poverty with earnings and children, so any count would be a guess. Use the share of tax returns claiming the credit (DOTAX, by tax area) as the uptake figure instead."

