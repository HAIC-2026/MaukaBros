# Program inventory: existing state and federal programs the assistant can point to.
#
# RULES
#   - Every fact comes from an official page or document saved by hand in pipeline/raw/programs/
#     (listed with its fingerprint in pipeline/raw/manifest.yaml). Nothing is filled in from memory.
#   - Each fact has `text` (what we show, in plain words) and `quote` (the exact words in the saved
#     file). validation/validate.py (group P) checks every quote, and every number in every income
#     table, against the file's text. A fact that cannot be quoted is left out.
#   - Program information is informational only: final eligibility is always decided by the
#     administering agency (brief, Business Rules). Show that note with every program.
#   - `related_measures` is OUR link to district measures (api/main.py MAP_METRICS); it is not a
#     claim from the source. `uptake` names program-use figures we hold.
#   - Rules change. `valid_for` is the period the document gives; `checked_on` is when the document
#     was saved. Re-save the documents and update both when rules change (see CHECKLIST.md).
#   - `likely_eligible` is OUR estimate (docs/ELIGIBILITY_METHOD.md): the ACS count of residents
#     under the program's income limit, stored as an indicator in pipeline/indicators.yaml. It
#     names the ACS cut, the program rule it approximates (with quotes, checked like the facts),
#     the universe, and which way it likely errs. `cut_percent` is checked against the program's
#     income table and the HHS Hawaiʻi guideline (validation group P). A program with no
#     defensible ACS proxy says so (`estimated: false`) instead of getting a number.

checked_on: "2026-11-16"
note_on_eligibility: "Informational only. Final eligibility is always decided by the agency that runs the program."

