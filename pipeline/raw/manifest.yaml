    source_id: bea_cainc1
    status: present
    url: https://apps.bea.gov/regional/zip/CAINC1.zip
    how: "Downloaded once with curl (a single request) by Claude Code at the team's request. BEA terms: pipeline/sources.yaml."
    downloaded_on: "2026-11-16T03:15:50Z" # UTC; 2026-11-15 in Hawaiʻi
