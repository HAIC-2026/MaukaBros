# Every saved source file the pipeline reads, where it came from, and when.
#
# RULES
#   - The pipeline reads only the files listed here. Nothing is downloaded while building, and
#     no script scans a website.
#   - Each file is downloaded once, by the method in `how`, and stored at `path` (relative to
#     pipeline/raw/). Do not edit the files.
#   - `sha256` is the file's fingerprint. pipeline/build.py refuses to use a file whose fingerprint
#     differs, so a replaced file cannot slip in without its date being updated here.
#     After downloading a new file, run `python pipeline/build.py`; it prints the fingerprint to
#     paste here.
#   - hawaii.gov files (DBEDT, DOTAX, DHS, Med-QUEST) must be downloaded by a person in a browser.
#     The Hawaiʻi.gov Terms of Use those sites link to prohibit access "through any automated
#     means (including... scripts...)" (see pipeline/sources.yaml).
#   - `status: needed` = not downloaded yet. The build skips it and says so.
#   - The ACS file (acs/acs5_2024.json) is made by pipeline/fetch_acs.py and records its own
#     download time; the OPSD file is recorded in pipeline/boundaries.yaml.

files:
